# Paket Haji Plus — persiapan iklan baru (akun & campaign belum ditentukan)
# Materi: Cloudinary folder Elharamainwisata/Haji (18 gambar + 18 video Hajj_2025).
# Tujuan WhatsApp (tombol "Kirim Pesan WhatsApp"), Page "Elharamain wisata".
#
#   python -m metads.preview config/haji-plus.yaml     # lihat mockup
#   python -m metads config/haji-plus.yaml             # dry-run
#   python -m metads config/haji-plus.yaml --apply     # buat di Meta, semua PAUSED
#
# Sebelum --apply: isi META_AD_ACCOUNT_ID akun Haji yang dituju, lalu cek
# nama campaign, budget, dan targeting di bawah.

name: haji-plus
page_id: "588336968031663"          # Elharamain wisata
page_name: "Elharamain wisata"      # hanya untuk preview
instagram_user_id: null

campaign:
  name: "[AUTO] Haji Plus"
  objective: OUTCOME_SALES          # sama dengan campaign WhatsApp Umroh
  special_ad_categories: []
  daily_budget: 150000              # rupiah/hari — sesuaikan

x-targeting: &targeting
  age_min: 30
  age_max: 65
  geo_locations:
    countries: [ID]
    location_types: [home, recent]
  targeting_automation:
    advantage_audience: 0

adsets:
  - name: "Haji Plus"
    destination: whatsapp
    targeting: *targeting
    source:
      folder: "Elharamainwisata/Haji"
      max_assets: 50
    ad_name_template: "{adset} | {asset} | judul{copy}"
    copies:
      - headlines:
          - "6800+ Google Review ⭐️⭐️⭐️⭐️⭐️ (5.0)"
          - "✈️Berangkat Haji Lebih Cepat Bersama Elharamain Wisata"
        description: "Pendaftaran 4000 USD · Masa tunggu 6-10 tahun"
        primary_text: |
