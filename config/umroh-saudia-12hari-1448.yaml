# Campaign Umroh 12 Hari Premium Saudia Airlines (Direct Flight) — Elharamain Wisata, musim 1448 H
# Jalankan:  python -m metads config/umroh-saudia-12hari-1448.yaml          (dry-run)
#            python -m metads config/umroh-saudia-12hari-1448.yaml --apply  (buat di Meta, semua PAUSED)

name: umroh-saudia-12hari-1448           # kunci unik untuk file state (state/umroh-saudia-12hari-1448.json)
page_id: "ISI_PAGE_ID"             # ID Facebook Page Elharamain Wisata
instagram_user_id: null            # opsional: ID akun IG @elharamainwisata

campaign:
  name: "[AUTO] Umroh 12 Hari Premium Saudia 1448H"
  objective: OUTCOME_TRAFFIC       # OUTCOME_LEADS / OUTCOME_SALES / OUTCOME_ENGAGEMENT juga bisa
  special_ad_categories: []
  # daily_budget: 300000           # isi di sini untuk CBO; kosongkan kalau budget per ad set

adsets:
  - name: "Umroh | Jabodetabek+Bandung | 30-60"
    daily_budget: 150000           # rupiah (IDR tidak punya satuan sen di Meta)
    optimization_goal: LANDING_PAGE_VIEWS
    billing_event: IMPRESSIONS
    targeting:
      geo_locations:
        # Sekitar 6 kantor: Jakarta, Bekasi, Depok, Tangerang, Bogor, Bandung.
        # Ganti dengan key kota dari Targeting Search API bila perlu.
        countries: [ID]
      age_min: 30
      age_max: 60
      targeting_automation:
        advantage_audience: 1
    source:
      folder: "elharamain/umroh-saudia-12hari-1448"  # folder di Cloudinary; tiap gambar/video baru = iklan baru
      # tag: umroh-saudia-12hari-1448                # atau pakai tag
      max_assets: 20
    link: "https://www.elharamainwisata.com"
    call_to_action: LEARN_MORE
    url_tags: "utm_source=meta&utm_medium=paid&utm_campaign=umroh-saudia-12hari-1448"
    ad_name_template: "{asset} | copy{copy}"
    copies:
      - headlines:                 # tiap judul = varian iklan terpisah untuk di-test
          - "✈️ Tiket Sudah Confirm, Jadwal Pasti"
          - "6700+ Google Review ⭐️⭐️⭐️⭐️⭐️ (5.0)"
        description: "Hotel Bintang 5 · Seat terbatas 45/keberangkatan"
