<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px "Segoe UI", sans-serif; background: #dfe3e8; user-select: none; }
  #tabs { display: flex; height: 36px; padding: 4px 4px 0; gap: 2px; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 6px; min-width: 120px; max-width: 220px; padding: 0 8px;
         background: #c9ced6; border-radius: 6px 6px 0 0; cursor: pointer; }
  .tab.active { background: #fff; }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .n { font-size: 10px; color: #fff; background: #5b6b7f; border-radius: 3px; padding: 0 4px; }
  .tab .x { border: 0; background: none; cursor: pointer; font-size: 14px; color: #555; }
  #new { border: 0; background: none; font-size: 20px; cursor: pointer; padding: 0 10px; }
  #bar { display: flex; gap: 4px; height: 40px; padding: 5px 6px; background: #fff; border-bottom: 1px solid #ccc; }
  #bar button { width: 32px; border: 0; background: none; font-size: 16px; cursor: pointer; border-radius: 4px; }
  #bar button:hover:not(:disabled) { background: #eee; }
  #bar button:disabled { color: #bbb; }
  #url { flex: 1; border: 1px solid #ccc; border-radius: 15px; padding: 0 12px; font-size: 13px; outline: none; }
  #url:focus { border-color: #4a90e2; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button id="back" title="Kembali">&#8592;</button>
  <button id="fwd" title="Maju">&#8594;</button>
  <button id="rel" title="Muat ulang">&#8635;</button>
  <input id="url" placeholder="Ketik alamat atau cari di Google" spellcheck="false">
</div>
<script>
  const $ = id => document.getElementById(id);
  const b = window.browser;
  $('back').onclick = () => b.back();
  $('fwd').onclick = () => b.forward();
  $('rel').onclick = () => b.reload();
  $('url').onkeydown = e => { if (e.key === 'Enter') { b.navigate($('url').value); $('url').blur(); } };

  b.onState(s => {
    const box = $('tabs');
    box.innerHTML = '';
    s.tabs.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'tab' + (t.id === s.activeId ? ' active' : '');
      el.title = t.title;
      el.innerHTML = '<span class="n"></span><span class="t"></span><button class="x" title="Tutup tab">&times;</button>';
      el.querySelector('.n').textContent = i + 1;
      el.querySelector('.t').textContent = (t.loading ? '⏳ ' : '') + t.title;
      el.onclick = () => b.switchTab(t.id);
      el.querySelector('.x').onclick = e => { e.stopPropagation(); b.closeTab(t.id); };
      box.appendChild(el);
    });
    const add = document.createElement('button');
    add.id = 'new'; add.title = 'Tab baru (Ctrl+T)'; add.textContent = '+';
    add.onclick = () => b.newTab();
    box.appendChild(add);

    const a = s.tabs.find(t => t.id === s.activeId);
    if (a) {
      if (document.activeElement !== $('url')) $('url').value = a.url;
      $('back').disabled = !a.canBack;
      $('fwd').disabled = !a.canForward;
    }
  });
</script>
</body>
</html>
